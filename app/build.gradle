plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qrnfc.tool'
    compileSdk 34

    defaultConfig {
        applicationId "com.qrnfc.tool"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "2.6"
    }

    // 签名信息从 keystore.properties 读取（该文件已被 .gitignore 排除，不随源码发布）
    def keystoreProps = new Properties()
    def ksFile = rootProject.file('keystore.properties')
    if (ksFile.exists()) {
        ksFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProps.getProperty('storeFile', 'release.keystore'))
            storePassword keystoreProps.getProperty('storePassword', '')
            keyAlias keystoreProps.getProperty('keyAlias', 'scan_nfc')
            keyPassword keystoreProps.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.1'
}
